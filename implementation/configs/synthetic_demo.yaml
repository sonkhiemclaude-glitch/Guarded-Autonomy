# Synthetic smoke-test demo. Every output is "synthetic smoke-test output, not a paper result".
name: synthetic_demo
kind: synthetic_demo
seed: 0
output_dir: outputs
synthetic: true
synthetic_demo:
  system_seeds: 3              # toy system-level run directories per configuration
  component_check:             # tiny abstract-model grid (seconds)
    suites: [cc1, cc2, cc3]
    n_seeds: 2
    steps: 40
    cc1: {ns: [20], vmaxs: [20.0], proposers: [rand, greedy, adv, stable]}
    cc2: {n: 20, attacks: [inflate], fracs: [0.1]}
    cc3: {n: 20, taus: [0.3, 0.7], watchdogs: [[0.05, 0.0]]}
